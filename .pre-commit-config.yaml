# Checks that run on your machine before every commit, so problems never reach GitHub.
# One-time setup:  uvx pre-commit install
# Run on everything:  uvx pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^frontend/angular\.json$ # the Angular CLI rewrites it without one
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/(tsconfig.*\.json|\.vscode/.*)$ # these allow comments
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  # Same ruff version as backend/pyproject.toml, so local checks match CI.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/(app|tests)/
      - id: ruff-format
        files: ^backend/(app|tests)/

  # Blocks commits that contain API keys, tokens or passwords.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
