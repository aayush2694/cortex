name: CI

# Run on every push to main, and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend   # every "run:" happens inside backend/

    # A real PostgreSQL for the integration tests.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cortex_test      # created automatically
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before running steps.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # tests/conftest.py reads this to find the test database.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cortex_test

    steps:
      - uses: actions/checkout@v5          # get your code

      # Third-party action pinned to an exact commit (v6.8.0) so a moved tag can't change it.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0; installs uv and Python
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked              # fails if uv.lock is out of date

      - name: Lint
        run: uv run ruff check app tests

      - name: Check formatting
        run: uv run ruff format --check app tests

      - name: Type check
        run: uv run mypy app

      # The tests build tables straight from the models, so check the real migrations too:
      # they must apply to an empty database, match the models, and be reversible.
      - name: Migrations apply, match the models, and roll back
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cortex_test
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Tests with coverage
        # Fails if coverage drops below 90%. The table shows on the run's summary page.
        run: >-
          uv run pytest -q --cov --cov-report=term
          --cov-report=markdown-append:$GITHUB_STEP_SUMMARY
          --cov-fail-under=90

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26                 # match your `node -v` major version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci                        # exact versions from package-lock.json

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build
