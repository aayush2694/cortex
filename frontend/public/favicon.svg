      .tile { fill: #f5f5f7; }
      .mark { stroke: #000000; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="8"/>
  <g class="mark" transform="translate(4 4)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
