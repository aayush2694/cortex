<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Cortex logo: the sidebar's brain tile (Tabler "brain" icon, MIT). Dark tile in light mode, light tile in dark mode. -->
  <style>
    .tile { fill: #1d1d1f; }
    .mark { stroke: #ffffff; }
