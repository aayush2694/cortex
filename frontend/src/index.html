<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Cortex</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cortex: learn DSA, Django, AI and system design by playing with them.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Apply the saved appearance before Angular boots, so the page never flashes the wrong mode.
    try {
      var a = localStorage.getItem('cortex.appearance') || 'auto';
      if (a === 'auto') a = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = a;
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
