# Cortex topic catalogue — the knowledge map.
#
# Each topic:
#   id:          unique slug (used in URLs)
#   track:       dsa | languages | frameworks | ai | system-design
#   title:       display name
#   summary:     one or two sentences
#   difficulty:  1 (easy) .. 5 (hard)
#   phase:       roadmap phase where its interactive content ships
#   visualizer:  (optional) algorithm key from the DSA visualizer
#   requires:    (optional) list of prerequisite topic ids
#   resources:   (optional) links to official docs: [{label, url}]
#
# The backend checks this file on startup: unknown ids or cycles stop the app.

