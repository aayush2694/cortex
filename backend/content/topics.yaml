    summary: Combine tables with inner, left and self joins, and find rows with no match.
    difficulty: 2
    phase: 3
    requires: [sql-basics]
    concepts:
      - "INNER JOIN keeps only matching rows; LEFT JOIN keeps every left row and fills NULLs."
      - "An anti-join (LEFT JOIN ... WHERE right.id IS NULL) finds rows with no match."
      - "NOT IN returns nothing if its list contains a NULL; prefer NOT EXISTS or an anti-join."
      - "A self-join joins a table to itself under two aliases, e.g. employees and managers."
    resources:
      - { label: "PostgreSQL tutorial: joins", url: "https://www.postgresql.org/docs/current/tutorial-join.html" }
