  # ---------------- DSA problem-solving patterns (batch 3: trees, graphs and heaps) ----------------
  - id: tree-bfs
    track: dsa
    title: Tree BFS
    summary: 'Visit a tree level by level with a queue: level order, right side view, shortest depth.'
    difficulty: 3
    phase: 1
    visualizer: tree_bfs
    requires:
    - trees
    - stacks-queues
    concepts:
    - A queue (first in, first out) naturally visits nodes in level order.
    - Snapshot len(queue) at the start of each level to know where the level ends.
    - 'BFS finds the minimum depth fastest: stop at the first leaf you reach.'
    pattern:
      group: Trees and graphs
      complexity: O(n) time · O(w) space
      walkthrough: Level order traversal
      signals:
      - The question talks about levels, rows or depth of a tree
      - You need the nearest or shallowest node
      - 'You need something per level: average, max, rightmost node'
      template: |-
        queue = deque([root])
        while queue:
            for _ in range(len(queue)):
                node = queue.popleft()
                visit(node)
                if node.left: queue.append(node.left)
                if node.right: queue.append(node.right)
      problems:
      - title: Average of Levels in Binary Tree
        slug: average-of-levels-in-binary-tree
        difficulty: easy
      - title: Minimum Depth of Binary Tree
        slug: minimum-depth-of-binary-tree
        difficulty: easy
      - title: Binary Tree Level Order Traversal
        slug: binary-tree-level-order-traversal
        difficulty: medium
      - title: Binary Tree Right Side View
        slug: binary-tree-right-side-view
        difficulty: medium
      - title: Binary Tree Zigzag Level Order Traversal
        slug: binary-tree-zigzag-level-order-traversal
        difficulty: medium

  - id: tree-dfs
    track: dsa
    title: Tree DFS
    summary: 'Go deep down one branch at a time with recursion: paths, depths, and bottom-up answers.'
    difficulty: 3
    phase: 1
    visualizer: tree_dfs
    requires:
    - trees
    - recursion
    concepts:
    - The call stack remembers the current path; returning from a call is backtracking.
    - Top-down DFS passes information down (remaining sum); bottom-up DFS returns answers up (height).
    - Many tree problems are one DFS where each node combines its children's results.
    pattern:
      group: Trees and graphs
      complexity: O(n) time · O(h) space
      walkthrough: Root-to-leaf path sum
      signals:
      - The question is about root-to-leaf paths
      - An answer for a node depends on its children (height, diameter)
      - You need pre-order, in-order or post-order traversal
      template: |-
        def dfs(node, state):
            if not node:
                return base_case
            left = dfs(node.left, new_state)
            right = dfs(node.right, new_state)
            return combine(node, left, right)
      problems:
      - title: Maximum Depth of Binary Tree
        slug: maximum-depth-of-binary-tree
        difficulty: easy
      - title: Invert Binary Tree
        slug: invert-binary-tree
        difficulty: easy
      - title: Path Sum
        slug: path-sum
        difficulty: easy
      - title: Diameter of Binary Tree
        slug: diameter-of-binary-tree
        difficulty: easy
      - title: Lowest Common Ancestor of a Binary Tree
        slug: lowest-common-ancestor-of-a-binary-tree
        difficulty: medium
      - title: Binary Tree Maximum Path Sum
        slug: binary-tree-maximum-path-sum
        difficulty: hard

  - id: grid-traversal
    track: dsa
    title: Grid Traversal
    summary: 'Treat a grid as a graph of cells and flood-fill with BFS or DFS: islands, regions, shortest paths.'
    difficulty: 3
    phase: 1
    visualizer: grid_traversal
    requires:
    - graphs
    - bfs
    concepts:
    - Each cell is a node with up to 4 neighbours; check bounds before every step.
    - Mark cells as visited when you add them to the queue, not when you pop them.
    - Start BFS from every source at once to model things spreading in parallel.
    pattern:
      group: Trees and graphs
      complexity: O(rows × cols) time and space
      walkthrough: Count the islands
      signals:
      - The input is a 2D grid of cells, like a map or a board
      - You need to count or measure connected regions
      - You need the fewest steps between cells (use BFS)
      - Something spreads step by step, like rotting oranges (multi-source BFS)
      template: |-
        for r in range(rows):
            for c in range(cols):
                if grid[r][c] == LAND and (r, c) not in seen:
                    count += 1
                    flood_fill(r, c)  # BFS or DFS over 4 neighbours
      problems:
      - title: Flood Fill
        slug: flood-fill
        difficulty: easy
      - title: Number of Islands
