  # ---------------- DSA problem-solving patterns (batch 1: arrays and strings) ----------------
  - id: two-pointers
    track: dsa
    title: Two Pointers
    summary: Move two indices through a sorted array or string to find pairs or partitions in O(n).
    difficulty: 2
    phase: 1
    visualizer: two_pointers
    requires:
    - arrays
    concepts:
    - Each step rules out one element for good, so the whole scan is O(n).
    - Opposite-end pointers work on sorted data; same-direction pointers (read/write) work for in-place filtering.
    - 'For 3Sum, fix one number and run two pointers on the rest: O(n²) instead of O(n³).'
    pattern:
      group: Arrays and strings
      complexity: O(n) time · O(1) space
      walkthrough: Pair with a target sum in a sorted array
      signals:
      - The input is sorted, or sorting it first is fine
      - You need a pair (or triple) that meets a condition
      - You compare elements from both ends, like a palindrome check
      - Brute force would check every pair in O(n²)
      template: |-
        left, right = 0, len(nums) - 1
        while left < right:
            if condition_met(nums[left], nums[right]):
                return left, right
            if need_bigger:
                left += 1
            else:
                right -= 1
      problems:
      - title: Valid Palindrome
        slug: valid-palindrome
        difficulty: easy
      - title: Remove Duplicates from Sorted Array
        slug: remove-duplicates-from-sorted-array
        difficulty: easy
      - title: Two Sum II - Input Array Is Sorted
        slug: two-sum-ii-input-array-is-sorted
        difficulty: medium
      - title: 3Sum
        slug: 3sum
        difficulty: medium
      - title: Container With Most Water
        slug: container-with-most-water
        difficulty: medium
      - title: Trapping Rain Water
        slug: trapping-rain-water
        difficulty: hard

  - id: sliding-window
    track: dsa
    title: Sliding Window
    summary: Keep a window over a contiguous range and slide it, instead of re-checking every subarray.
    difficulty: 3
    phase: 1
    visualizer: sliding_window
    requires:
    - two-pointers
    - hash-maps
    concepts:
    - Fixed-size windows move both ends together; variable windows grow right and shrink left.
    - Track what's inside the window with a counter or hash map, updating it in O(1) per step.
    - Every element enters and leaves the window at most once, so the total work is O(n).
    pattern:
      group: Arrays and strings
      complexity: O(n) time · O(k) space
      walkthrough: Longest substring without repeating characters
      signals:
      - The question is about a contiguous subarray or substring
      - It asks for the longest, shortest, or a count of windows
      - There's a rule like 'at most k distinct' or 'sum at least s'
      - Brute force would check every subarray in O(n²)
      template: |-
        left = 0
        for right, x in enumerate(nums):
            add(x)
            while window_breaks_rule():
                remove(nums[left])
                left += 1
            best = max(best, right - left + 1)
      problems:
      - title: Maximum Average Subarray I
        slug: maximum-average-subarray-i
        difficulty: easy
      - title: Longest Substring Without Repeating Characters
        slug: longest-substring-without-repeating-characters
        difficulty: medium
      - title: Minimum Size Subarray Sum
        slug: minimum-size-subarray-sum
        difficulty: medium
      - title: Permutation in String
        slug: permutation-in-string
        difficulty: medium
      - title: Longest Repeating Character Replacement
        slug: longest-repeating-character-replacement
        difficulty: medium
      - title: Minimum Window Substring
        slug: minimum-window-substring
        difficulty: hard

  - id: prefix-sum
    track: dsa
    title: Prefix Sum
    summary: Precompute running sums so any subarray sum is a single subtraction.
    difficulty: 3
    phase: 1
    visualizer: prefix_sum
    requires:
    - arrays
    - hash-maps
    concepts:
    - sum(i..j) = prefix[j + 1] - prefix[i], so every range sum costs O(1) after O(n) setup.
    - Pair prefix sums with a hash map to count subarrays with a target sum in one pass.
    - 'The same idea works in 2D: a prefix-sum table answers any rectangle sum in O(1).'
    pattern:
      group: Arrays and strings
      complexity: O(n) time · O(n) space
      walkthrough: Count subarrays that sum to k
      signals:
      - You need many range-sum queries on the same array
      - The question asks for subarrays with a given sum
      - Negative numbers rule out a sliding window
      - Balance problems, like equal numbers of 0s and 1s
      template: |-
        prefix = 0
        seen = {0: 1}
        for x in nums:
            prefix += x
            count += seen.get(prefix - k, 0)
            seen[prefix] = seen.get(prefix, 0) + 1
      problems:
      - title: Range Sum Query - Immutable
        slug: range-sum-query-immutable
        difficulty: easy
      - title: Find Pivot Index
        slug: find-pivot-index
        difficulty: easy
      - title: Subarray Sum Equals K
        slug: subarray-sum-equals-k
        difficulty: medium
      - title: Product of Array Except Self
        slug: product-of-array-except-self
        difficulty: medium
      - title: Continuous Subarray Sum
        slug: continuous-subarray-sum
        difficulty: medium

  - id: frequency-counting
    track: dsa
    title: Hash Map Lookups
    summary: 'Trade memory for speed: remember what you''ve seen in a hash map for O(1) lookups.'
    difficulty: 2
    phase: 1
    visualizer: frequency_counting
    requires:
    - hash-maps
    concepts:
    - A hash map turns an O(n) search into an O(1) lookup on average.
    - Counting with Counter or a dict solves anagram and 'most frequent' questions.
    - 'Pick the key carefully: sorted letters group anagrams, a tuple of counts works too.'
    pattern:
      group: Arrays and strings
      complexity: O(n) time · O(n) space
      walkthrough: Two sum in a single pass
      signals:
      - You keep asking 'have I seen this before?'
      - You compare counts of characters or items (anagrams)
      - You need to group items by a shared key
      - A nested loop is only there to search for something
      template: |-
        seen = {}
        for i, x in enumerate(nums):
            if complement(x) in seen:
                return seen[complement(x)], i
            seen[x] = i
      problems:
      - title: Two Sum
        slug: two-sum
        difficulty: easy
      - title: Valid Anagram
        slug: valid-anagram
        difficulty: easy
      - title: Group Anagrams
        slug: group-anagrams
        difficulty: medium
      - title: Top K Frequent Elements
        slug: top-k-frequent-elements
        difficulty: medium
      - title: Longest Consecutive Sequence
        slug: longest-consecutive-sequence
        difficulty: medium

  - id: modified-binary-search
    track: dsa
    title: Modified Binary Search
    summary: 'Binary search beyond plain sorted arrays: rotated arrays, boundaries, and searching for the answer.'
    difficulty: 3
    phase: 1
    visualizer: modified_binary_search
    requires:
    - binary-search
    concepts:
    - You only need a rule that says which half can't hold the answer, not a fully sorted array.
    - In a rotated array, one side of mid is always sorted; check whether the target is in it.
    - '''Binary search on the answer'': search over possible answers and test each guess.'
    pattern:
      group: Searching
      complexity: O(log n) time · O(1) space
      walkthrough: Search in a rotated sorted array
      signals:
      - The data is sorted, or sorted in pieces (rotated)
      - You need the first or last position that meets a condition
      - The answer is a number in a range, and you can check a guess (min speed, capacity)
      - The expected complexity is O(log n)
      template: |-
        lo, hi = 0, len(nums) - 1
        while lo <= hi:
            mid = (lo + hi) // 2
            if is_answer(mid):
                return mid
            if answer_is_left(mid):
                hi = mid - 1
            else:
                lo = mid + 1
      problems:
      - title: Binary Search
        slug: binary-search
        difficulty: easy
      - title: Search in Rotated Sorted Array
        slug: search-in-rotated-sorted-array
        difficulty: medium
      - title: Find Minimum in Rotated Sorted Array
        slug: find-minimum-in-rotated-sorted-array
        difficulty: medium
      - title: Koko Eating Bananas
        slug: koko-eating-bananas
        difficulty: medium
      - title: Median of Two Sorted Arrays
        slug: median-of-two-sorted-arrays
        difficulty: hard

  - id: cyclic-sort
    track: dsa
    title: Cyclic Sort
    summary: When values are 1..n, swap each one into its own slot to find missing or duplicate numbers.
    difficulty: 3
    phase: 1
    visualizer: cyclic_sort
    requires:
    - arrays
    concepts:
    - Value x belongs at index x - 1; each swap puts at least one number in its final place.
    - After sorting, any index i that doesn't hold i + 1 points to a missing or duplicate value.
    - Each number moves at most once, so it's O(n) even though there's a while loop.
    pattern:
      group: Searching
      complexity: O(n) time · O(1) space
      walkthrough: Find all numbers missing from 1..n
      signals:
      - Values are in a known range like 1..n or 0..n
      - You need missing, duplicate, or first-missing-positive numbers
      - You must use O(1) extra space
      template: |-
        i = 0
        while i < len(nums):
            home = nums[i] - 1
            if nums[i] != nums[home]:
                nums[i], nums[home] = nums[home], nums[i]
            else:
                i += 1
      problems:
      - title: Missing Number
        slug: missing-number
        difficulty: easy
      - title: Find All Numbers Disappeared in an Array
        slug: find-all-numbers-disappeared-in-an-array
        difficulty: easy
      - title: Find the Duplicate Number
        slug: find-the-duplicate-number
        difficulty: medium
      - title: Find All Duplicates in an Array
        slug: find-all-duplicates-in-an-array
        difficulty: medium
      - title: First Missing Positive
        slug: first-missing-positive
        difficulty: hard

