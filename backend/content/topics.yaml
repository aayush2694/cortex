    summary: GROUP BY, COUNT, SUM, AVG, and filtering groups with HAVING.
    difficulty: 2
    phase: 3
    requires: [sql-basics]
    concepts:
      - "GROUP BY makes one output row per group; every selected column must be grouped or aggregated."
      - "WHERE filters rows before grouping; HAVING filters groups after."
      - "COUNT(*) counts rows; COUNT(column) skips NULLs."
      - "Aggregates ignore NULL values, so AVG of (10, NULL) is 10."
    resources:
      - { label: "PostgreSQL tutorial: aggregates", url: "https://www.postgresql.org/docs/current/tutorial-agg.html" }
      - { label: "PostgreSQL: aggregate functions", url: "https://www.postgresql.org/docs/current/functions-aggregate.html" }

  - id: sql-subqueries-ctes
    track: languages
    title: Subqueries & CTEs
    summary: Queries inside queries, and WITH clauses that name each step.
    difficulty: 3
    phase: 3
    requires: [sql-joins, sql-aggregation]
    concepts:
      - "A scalar subquery returns one value; if it finds no row, the value is NULL."
      - "A correlated subquery refers to the outer row and runs once per row."
      - "WITH (a CTE) names an intermediate result, making long queries readable step by step."
      - "EXISTS stops at the first match and handles NULLs safely."
    resources:
      - { label: "PostgreSQL: subquery expressions", url: "https://www.postgresql.org/docs/current/functions-subquery.html" }
      - { label: "PostgreSQL: WITH queries", url: "https://www.postgresql.org/docs/current/queries-with.html" }

  - id: sql-window-functions
    track: languages
    title: Window Functions
    summary: Running totals, rankings and comparisons with neighbouring rows, without GROUP BY.
    difficulty: 3
    phase: 3
    requires: [sql-aggregation]
    concepts:
      - "A window function computes across related rows but keeps every row in the result."
      - "PARTITION BY restarts the calculation per group; ORDER BY sets the order inside it."
      - "ROW_NUMBER never ties, RANK leaves gaps after ties, DENSE_RANK doesn't."
      - "LAG and LEAD read values from the previous and next rows."
      - "Window functions can't be used in WHERE; filter them in an outer query."
    resources:
      - { label: "PostgreSQL tutorial: window functions", url: "https://www.postgresql.org/docs/current/tutorial-window.html" }
      - { label: "PostgreSQL: window functions", url: "https://www.postgresql.org/docs/current/functions-window.html" }
