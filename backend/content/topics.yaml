  # ---------------- DSA problem-solving patterns (batch 4: recursion) ----------------
  - id: backtracking
    track: dsa
    title: Backtracking
    summary: 'Build answers one choice at a time, undo, and try the next: subsets, permutations, puzzles.'
    difficulty: 4
    phase: 1
    visualizer: backtracking
    requires:
    - recursion
    - trees
    concepts:
    - 'Choose, explore, un-choose: the undo step is what makes it backtracking.'
    - The calls form a decision tree; each root-to-leaf path is one candidate answer.
    - 'Prune early: stop exploring a branch as soon as it can''t lead to a valid answer.'
    pattern:
      group: Recursion
      complexity: Exponential time · O(n) space
      walkthrough: Generate every subset
      signals:
      - You must list all subsets, permutations or combinations
      - The question is a puzzle with constraints (N-Queens, Sudoku, word search)
      - Inputs are small (n around 10 to 20), so exponential time is fine
      - Partial answers can be ruled out early (pruning)
      template: |-
        def backtrack(state):
            if is_complete(state):
                results.append(copy(state))
                return
            for choice in choices(state):
                if is_valid(state, choice):
                    make(choice)
                    backtrack(state)
                    undo(choice)
      problems:
      - title: Subsets
        slug: subsets
        difficulty: medium
      - title: Permutations
        slug: permutations
        difficulty: medium
      - title: Combination Sum
        slug: combination-sum
        difficulty: medium
      - title: Letter Combinations of a Phone Number
        slug: letter-combinations-of-a-phone-number
        difficulty: medium
      - title: Word Search
        slug: word-search
        difficulty: medium
      - title: N-Queens
        slug: n-queens
        difficulty: hard

  - id: dp-grid
    track: dsa
    title: Dynamic Programming on Grids
    summary: 'Fill a table where each cell reuses answers to smaller subproblems: paths, edit distance, LCS.'
    difficulty: 4
    phase: 1
    visualizer: dp_grid
    requires:
    - dynamic-programming
    concepts:
    - Define dp[i][j] in words first; the recurrence and base cases follow from that.
    - Fill the table in an order where every cell's inputs are already computed.
    - Often only the previous row is needed, which cuts memory to O(m).
    pattern:
      group: Recursion
      complexity: O(n · m) time and space
      walkthrough: Longest common subsequence
      signals:
      - The question compares two strings or sequences
      - You count paths, or find the cheapest path, in a grid
      - The answer for a prefix or position depends on smaller ones
      - Plain recursion would solve the same subproblem many times
      template: |-
        dp = [[0] * (m + 1) for _ in range(n + 1)]
        for i in range(1, n + 1):
            for j in range(1, m + 1):
                dp[i][j] = best_of(dp[i - 1][j],
                                   dp[i][j - 1],
                                   dp[i - 1][j - 1])
        return dp[n][m]
      problems:
      - title: Unique Paths
        slug: unique-paths
        difficulty: medium
      - title: Minimum Path Sum
        slug: minimum-path-sum
        difficulty: medium
      - title: Longest Common Subsequence
        slug: longest-common-subsequence
        difficulty: medium
      - title: Longest Palindromic Subsequence
        slug: longest-palindromic-subsequence
        difficulty: medium
      - title: Edit Distance
        slug: edit-distance
        difficulty: medium

