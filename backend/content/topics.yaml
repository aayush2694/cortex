  - id: topological-sort
    track: dsa
    title: Topological Sort
    summary: Order tasks so every prerequisite comes first, and detect impossible (cyclic) dependencies.
    difficulty: 4
    phase: 1
    visualizer: topological_sort
    requires:
    - graphs
    - bfs
    concepts:
    - In-degree is the number of prerequisites still unfinished for a task.
    - If some tasks never reach in-degree 0, the graph has a cycle and no valid order exists.
    - 'DFS works too: add a node to the order after all its descendants, then reverse.'
    pattern:
      group: Trees and graphs
      complexity: O(V + E) time and space
      walkthrough: Order tasks by their prerequisites
      signals:
      - Tasks, courses or builds have 'must come before' rules
      - You need a valid order, or to know if one exists
      - The graph is directed and should have no cycles
      template: |-
        indegree = count_incoming_edges(graph)
        queue = deque(v for v in graph if indegree[v] == 0)
        while queue:
            v = queue.popleft(); order.append(v)
            for w in graph[v]:
                indegree[w] -= 1
                if indegree[w] == 0:
                    queue.append(w)
      problems:
      - title: Course Schedule
        slug: course-schedule
        difficulty: medium
      - title: Course Schedule II
        slug: course-schedule-ii
        difficulty: medium
      - title: Find Eventual Safe States
        slug: find-eventual-safe-states
        difficulty: medium
      - title: Minimum Height Trees
        slug: minimum-height-trees
        difficulty: medium
      - title: Parallel Courses III
        slug: parallel-courses-iii
        difficulty: hard

  - id: union-find
    track: dsa
    title: Union-Find
    summary: Track which items are connected as edges arrive, and spot the edge that creates a cycle.
    difficulty: 4
    phase: 1
    visualizer: union_find
    requires:
    - graphs
    concepts:
    - Each group is a tree; its root is the group's name.
    - Path compression in find() keeps the trees flat, making operations almost O(1).
    - Union by size or rank (attach the smaller tree) keeps it fast in the worst case.
    pattern:
      group: Trees and graphs
      complexity: ≈ O(1) per operation
      walkthrough: Connect groups and spot cycles
      signals:
      - You need the number of connected groups (provinces, components)
      - Connections arrive one by one and you must check 'already connected?'
      - You need to find the edge that creates a cycle
      template: |-
        parent = {x: x for x in items}
        def find(x):
            while parent[x] != x:
                parent[x] = parent[parent[x]]
                x = parent[x]
            return x
        def union(a, b):
            parent[find(b)] = find(a)
      problems:
      - title: Number of Provinces
        slug: number-of-provinces
        difficulty: medium
      - title: Redundant Connection
        slug: redundant-connection
        difficulty: medium
      - title: Number of Operations to Make Network Connected
        slug: number-of-operations-to-make-network-connected
        difficulty: medium
      - title: Accounts Merge
        slug: accounts-merge
        difficulty: medium
      - title: Most Stones Removed with Same Row or Column
        slug: most-stones-removed-with-same-row-or-column
        difficulty: medium

  - id: top-k-elements
    track: dsa
    title: Top K Elements
    summary: Keep a heap of size k to find the k largest, smallest or most frequent items efficiently.
    difficulty: 3
    phase: 1
    visualizer: top_k_elements
    requires:
    - heaps
    concepts:
    - 'For the k largest, use a min-heap of size k: its root is the weakest member of the top k.'
    - Python's heapq is a min-heap; push negatives to get a max-heap.
    - O(n log k) beats sorting (O(n log n)) when k is much smaller than n.
    pattern:
      group: Heaps
      complexity: O(n log k) time · O(k) space
      walkthrough: Kth largest with a min-heap
      signals:
      - The question says 'top k', 'k largest', 'k closest' or 'kth'
      - You need a running median or best-so-far from a stream
      - You need to merge k sorted lists
      template: |-
        heap = []
        for x in nums:
            heapq.heappush(heap, x)
            if len(heap) > k:
                heapq.heappop(heap)  # drop the smallest
        return heap[0]  # kth largest
      problems:
      - title: Last Stone Weight
        slug: last-stone-weight
        difficulty: easy
      - title: Kth Largest Element in a Stream
        slug: kth-largest-element-in-a-stream
        difficulty: easy
      - title: Kth Largest Element in an Array
        slug: kth-largest-element-in-an-array
        difficulty: medium
      - title: K Closest Points to Origin
        slug: k-closest-points-to-origin
        difficulty: medium
      - title: Find Median from Data Stream
        slug: find-median-from-data-stream
        difficulty: hard
      - title: Merge k Sorted Lists
        slug: merge-k-sorted-lists
        difficulty: hard

