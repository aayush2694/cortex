    resources:
      - { label: Load-balancing options, url: "https://learn.microsoft.com/en-us/azure/architecture/guide/technology-choices/load-balancing-overview" }
      - { label: The System Design Primer, url: "https://github.com/donnemartin/system-design-primer" }

  - id: caching
    track: system-design
    title: Caching
    summary: Keeping hot data close - cache-aside, write-through, eviction policies like LRU, and invalidation.
    difficulty: 3
    phase: 3
    requires: [sd-fundamentals, hash-maps]
    concepts:
      - "Cache-aside: read from the cache; on a miss, load from the database and store the result in the cache."
      - "Write-through updates the cache on every write; write-back delays the database write for speed, at some risk."
      - "Eviction policies like LRU decide what to drop when the cache is full; TTLs expire data after a set time."
      - "Invalidation is the hard part, so decide up front how stale each kind of data is allowed to be."
      - "Watch for cache stampedes, where many requests miss at once and overwhelm the database."
    resources:
      - { label: Caching guidance, url: "https://learn.microsoft.com/en-us/azure/architecture/best-practices/caching" }
      - { label: Cache-aside pattern, url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/cache-aside" }
      - { label: HTTP caching, url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Caching" }

  - id: cdn
    track: system-design
    title: CDNs & Edge Caching
    summary: Serve static files and cacheable responses from servers close to your users.
    difficulty: 2
    phase: 3
    requires: [caching, networking-basics]
    concepts:
      - "A CDN copies content to edge servers around the world, so users download it from somewhere nearby."
      - "It works best for static assets: images, video, and JavaScript and CSS bundles."
      - "Cache-Control headers tell the CDN and browsers how long a response may be reused."
      - "Fingerprinted file names (app.3f9a.js) let you cache files forever and still ship updates instantly."
    resources:
      - { label: CDN best practices, url: "https://learn.microsoft.com/en-us/azure/architecture/best-practices/cdn" }
      - { label: HTTP caching, url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Caching" }

  - id: databases
    track: system-design
    title: Databases & Indexing
    summary: SQL vs NoSQL, indexes, transactions and isolation, and when to normalise.
    difficulty: 3
    phase: 3
    requires: [sd-fundamentals]
    concepts:
      - "Relational databases give you SQL, joins and ACID transactions. Most products should start with one."
      - "NoSQL stores (key-value, document, wide-column) trade query flexibility for scale or a simpler model."
      - "An index is a sorted lookup structure, usually a B-tree. It speeds up reads but slows down writes."
      - "Transaction isolation levels control which concurrent changes a transaction is allowed to see."
      - "Normalise to avoid duplicated data; denormalise selectively where reads must be fast."
    resources:
      - { label: Indexes (PostgreSQL), url: "https://www.postgresql.org/docs/current/indexes.html" }
      - { label: Transaction isolation (PostgreSQL), url: "https://www.postgresql.org/docs/current/transaction-iso.html" }

  - id: database-replication
    track: system-design
    title: Replication
    summary: Keep copies of your data on several machines for availability and to scale reads.
    difficulty: 3
    phase: 3
    requires: [databases]
    concepts:
      - "Leader-follower replication: one node takes writes and streams changes to read-only followers."
      - "Synchronous replication is safer but slower; asynchronous is faster but can lose the latest writes."
      - "Followers lag behind, so users may not see their own writes. Plan for read-your-writes consistency."
      - "Failover promotes a follower when the leader dies, and must avoid having two leaders (split brain)."
    resources:
      - { label: High availability and replication (PostgreSQL), url: "https://www.postgresql.org/docs/current/high-availability.html" }
      - { label: The System Design Primer, url: "https://github.com/donnemartin/system-design-primer" }

  - id: consistent-hashing
    track: system-design
    title: Consistent Hashing
    summary: Spread keys across servers so that adding or removing a server moves only a small share of keys.
    difficulty: 3
    phase: 3
    requires: [hash-maps, load-balancing]
    concepts:
      - "Plain hash(key) % N reshuffles almost every key whenever N changes."
      - "Consistent hashing puts servers and keys on a ring; each key belongs to the next server clockwise."
      - "Virtual nodes give each server many points on the ring, which spreads keys more evenly."
      - "Distributed caches and Dynamo-style databases use it to place data."
    resources:
      - { label: "Dynamo paper (Amazon, PDF)", url: "https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf" }

  - id: sharding
    track: system-design
    title: Partitioning & Sharding
    summary: Split a dataset across many databases when one machine can no longer hold it or keep up.
    difficulty: 4
    phase: 3
    requires: [database-replication, consistent-hashing]
    concepts:
      - "Sharding (horizontal partitioning) splits rows across databases using a shard key."
      - "A good shard key spreads load evenly and keeps data that is read together on the same shard."
      - "Range-based sharding keeps order but risks hot spots; hash-based sharding spreads load but loses order."
      - "Cross-shard queries and transactions are slow and complex, so design the data model to avoid them."
      - "Plan for resharding early: moving data while serving traffic is one of the hardest operations."
    resources:
      - { label: Data partitioning guidance, url: "https://learn.microsoft.com/en-us/azure/architecture/best-practices/data-partitioning" }
      - { label: Sharding pattern, url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/sharding" }

  - id: message-queues
    track: system-design
    title: Message Queues
    summary: Decoupling services with queues and logs - background work, load leveling, retries and dead letters.
    difficulty: 3
    phase: 3
    requires: [sd-fundamentals, stacks-queues]
    concepts:
      - "A queue decouples producers from consumers, so slow work happens in the background."
      - "Queues absorb traffic spikes: consumers work through the backlog at their own pace (load leveling)."
      - "Most queues deliver at least once, so consumers must be idempotent and safe to run twice."
      - "Dead-letter queues hold messages that keep failing, so one bad message does not block the rest."
      - "Logs like Kafka keep messages so they can be replayed; classic queues delete them once consumed."
    resources:
      - { label: Queue-based load leveling, url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/queue-based-load-leveling" }
      - { label: Introduction to Kafka, url: "https://kafka.apache.org/intro" }

  - id: event-driven
    track: system-design
    title: Event-Driven Architecture
    summary: Services react to events instead of calling each other directly - pub/sub, event sourcing and CQRS.
    difficulty: 4
    phase: 3
    requires: [message-queues, api-design]
    concepts:
      - "Publish/subscribe lets one event reach many independent subscribers without the publisher knowing them."
      - "Events describe facts that already happened (OrderPlaced); commands ask for something to happen."
      - "Event sourcing stores every change as an event and rebuilds the current state by replaying them."
      - "CQRS uses separate models for writing and for reading, each optimised for its own job."
      - "The price is eventual consistency: different parts of the system catch up at different times."
    resources:
      - { label: Event-driven architecture style, url: "https://learn.microsoft.com/en-us/azure/architecture/guide/architecture-styles/event-driven" }
      - { label: Publisher-subscriber pattern, url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/publisher-subscriber" }
      - { label: "CQRS (Martin Fowler)", url: "https://martinfowler.com/bliki/CQRS.html" }
      - { label: "Event sourcing (Martin Fowler)", url: "https://martinfowler.com/eaaDev/EventSourcing.html" }

  - id: rate-limiting
    track: system-design
    title: Rate Limiting
    summary: Protect services from overload and abuse by capping how many requests each client can make.
    difficulty: 3
    phase: 3
    requires: [api-design, caching]
    concepts:
      - "Token bucket: tokens refill at a steady rate and each request spends one, which allows short bursts."
      - "Leaky bucket, fixed window and sliding window are alternatives with different burst behaviour."
      - "Keep counters in a fast shared store like Redis so every server enforces the same limits."
      - "Reply with HTTP 429 and a Retry-After header so well-behaved clients know when to try again."
    resources:
      - { label: Rate limiting pattern, url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/rate-limiting-pattern" }
      - { label: "Handling overload (Google SRE book)", url: "https://sre.google/sre-book/handling-overload/" }

  - id: microservices
    track: system-design
    title: Monoliths & Microservices
    summary: When to split one application into independently deployed services, and what that costs.
    difficulty: 3
    phase: 3
    requires: [api-design, message-queues]
    concepts:
      - "A well-structured monolith is the right starting point for most products and small teams."
      - "Microservices let teams deploy and scale parts independently, at the cost of network calls and operational complexity."
      - "Split services along business capabilities, and give each service ownership of its own data."
      - "Distributed systems fail partially, so every call between services needs a timeout and a failure plan."
    resources:
      - { label: "Microservices (Martin Fowler)", url: "https://martinfowler.com/articles/microservices.html" }
      - { label: Microservices architecture style, url: "https://learn.microsoft.com/en-us/azure/architecture/guide/architecture-styles/microservices" }

  - id: resilience-patterns
    track: system-design
    title: Resilience Patterns
    summary: Keep working when dependencies fail - timeouts, retries with backoff, circuit breakers and bulkheads.
    difficulty: 4
    phase: 3
    requires: [microservices]
    concepts:
      - "Always set timeouts: a slow dependency is often worse than a dead one."
      - "Retry transient failures with exponential backoff and jitter, so retries do not turn into a storm."
      - "A circuit breaker stops calling a failing service for a while, giving it time to recover."
      - "Bulkheads isolate resources such as thread pools and connections, so one failure cannot sink everything."
      - "Degrade gracefully: serve cached or partial results instead of an error page."
    resources:
      - { label: "Timeouts, retries and backoff with jitter (AWS)", url: "https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/" }
      - { label: Circuit breaker pattern, url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/circuit-breaker" }
      - { label: Bulkhead pattern, url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/bulkhead" }

  - id: observability
    track: system-design
    title: Observability
    summary: Know what your system is doing in production - logs, metrics, traces and service level objectives.
    difficulty: 3
    phase: 3
    requires: [sd-fundamentals]
    concepts:
      - "Logs record events, metrics measure things over time, and traces follow one request across services."
      - "Watch the four golden signals: latency, traffic, errors and saturation."
      - "An SLO is a reliability target (for example 99.9% of requests under 300 ms); the error budget is what is left to spend."
      - "Alert on symptoms users feel, not on every internal cause."
    resources:
      - { label: Observability primer (OpenTelemetry), url: "https://opentelemetry.io/docs/concepts/observability-primer/" }
      - { label: "Service level objectives (Google SRE book)", url: "https://sre.google/sre-book/service-level-objectives/" }
      - { label: "Monitoring distributed systems (Google SRE book)", url: "https://sre.google/sre-book/monitoring-distributed-systems/" }

  - id: search-systems
    track: system-design
    title: Search Systems
    summary: Find documents by their words, fast, using inverted indexes and relevance ranking.
    difficulty: 3
    phase: 3
    requires: [databases]
    concepts:
      - "An inverted index maps each word to the list of documents that contain it."
      - "Text is tokenised and normalised (lowercased, stemmed) before it is indexed."
      - "Results are ranked by relevance, for example with BM25 scoring."
      - "Search indexes are usually updated asynchronously from the main database."
    resources:
      - { label: Full text search (PostgreSQL), url: "https://www.postgresql.org/docs/current/textsearch-intro.html" }

  - id: blob-storage
    track: system-design
    title: File Uploads & Object Storage
    summary: Store images, videos and documents in object storage instead of your database.
    difficulty: 2
    phase: 3
    requires: [api-design, cdn]
    concepts:
      - "Object storage (such as Amazon S3 or Azure Blob Storage) holds large files cheaply; the database keeps only their metadata."
      - "Let clients upload directly using short-lived signed URLs, so files never pass through your servers."
      - "Serve popular files through a CDN placed in front of the storage."
      - "Process uploads (thumbnails, virus scans) in the background using a queue."
    resources:
      - { label: Valet key pattern, url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/valet-key" }
      - { label: CDN best practices, url: "https://learn.microsoft.com/en-us/azure/architecture/best-practices/cdn" }

  - id: distributed-systems
    track: system-design
    title: Distributed Systems
    summary: Consistency models, the CAP theorem, quorums, and what happens when the network fails.
    difficulty: 5
    phase: 3
    requires: [database-replication, message-queues]
    concepts:
      - "The network is unreliable: messages can be lost, delayed or duplicated, and clocks drift apart."
      - "CAP theorem: during a network partition you must choose between consistency and availability."
      - "Strong consistency means every read sees the latest write; eventual consistency means replicas converge later."
      - "Quorums (W + R > N) give consistent reads in leaderless replicated stores."
    resources:
      - { label: "Consistency models (Jepsen)", url: "https://jepsen.io/consistency" }
      - { label: "Dynamo paper (Amazon, PDF)", url: "https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf" }

  - id: consensus
    track: system-design
    title: Consensus & Leader Election
    summary: How a group of machines agrees on one value or one leader, even when some of them fail.
    difficulty: 5
    phase: 3
    requires: [distributed-systems]
    concepts:
      - "Consensus algorithms like Raft keep a replicated log identical on a majority of nodes."
      - "A cluster of 2f + 1 nodes survives f failures, which is why clusters usually have 3 or 5 nodes."
      - "Leader election picks one node to coordinate; terms or epochs stop an old leader from acting."
      - "Coordination services such as etcd and ZooKeeper provide locks and configuration built on consensus."
    resources:
      - { label: The Raft consensus algorithm, url: "https://raft.github.io/" }
      - { label: Leader election pattern, url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/leader-election" }

  # ---------------- System design: interview case studies ----------------

  - id: design-url-shortener
    track: system-design
    title: "Case Study: URL Shortener"
    summary: Design a link shortener - short codes, fast redirects, and a read-heavy workload.
    difficulty: 3
    phase: 3
    requires: [caching, databases, api-design]
    concepts:
      - "Estimate scale first: redirects (reads) outnumber new links (writes) by roughly 100 to 1."
      - "Generate short codes with base62 encoding of a counter or a random ID, and handle collisions."
      - "Serve redirects from a cache, because most traffic goes to a small set of popular links."
      - "Choose HTTP 301 or 302 redirects depending on whether you need to count clicks."
    resources:
      - { label: "Similar design: Pastebin (System Design Primer)", url: "https://github.com/donnemartin/system-design-primer/blob/master/solutions/system_design/pastebin/README.md" }

  - id: design-chat
    track: system-design
    title: "Case Study: Chat System"
    summary: Design real-time one-to-one and group messaging with presence and message history.
    difficulty: 4
    phase: 3
    requires: [message-queues, load-balancing, databases]
    concepts:
      - "Keep a persistent WebSocket connection per online user, so the server can push messages instantly."
      - "Route messages through a pub/sub layer, because sender and receiver may be connected to different servers."
      - "Order messages per conversation with sequence numbers rather than relying on timestamps."
      - "Reach offline users with push notifications, and sync missed messages when they reconnect."
    resources:
      - { label: The WebSocket API, url: "https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API" }
      - { label: Publisher-subscriber pattern, url: "https://learn.microsoft.com/en-us/azure/architecture/patterns/publisher-subscriber" }

  - id: design-news-feed
    track: system-design
    title: "Case Study: News Feed"
    summary: Design a social feed that shows each user recent posts from the people they follow.
    difficulty: 5
    phase: 3
    requires: [caching, sharding, message-queues]
    concepts:
      - "Fan-out on write precomputes every follower's feed when someone posts: fast reads, heavy writes."
      - "Fan-out on read builds the feed when it is requested: cheap writes, slower reads."
      - "A hybrid fans out for normal accounts and merges posts from very popular accounts at read time."
      - "Store each feed in a cache as a list of post IDs, and load the post details separately."
    resources:
      - { label: "Similar design: Twitter timeline (System Design Primer)", url: "https://github.com/donnemartin/system-design-primer/blob/master/solutions/system_design/twitter/README.md" }
