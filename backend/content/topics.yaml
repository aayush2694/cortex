  # ---------------- DSA problem-solving patterns (batch 2: linked lists, stacks and intervals) ----------------
  - id: fast-slow-pointers
    track: dsa
    title: Fast & Slow Pointers
    summary: Two pointers moving at different speeds detect cycles and find middles in one pass.
    difficulty: 3
    phase: 1
    visualizer: fast_slow_pointers
    requires:
    - linked-lists
    - two-pointers
    concepts:
    - Inside a loop the fast pointer gains one step per move, so it must catch the slow one.
    - When fast reaches the end, slow is exactly at the middle.
    - After they meet, a pointer from the head and one from the meeting point meet at the cycle start.
    pattern:
      group: Linked lists
      complexity: O(n) time · O(1) space
      walkthrough: Find where a linked list's cycle starts
      signals:
      - You need to detect a loop in a linked list or a sequence
      - You need the middle of a linked list in one pass
      - A sequence of numbers might repeat (like the happy number problem)
      - You must use O(1) extra space, so no visited set
      template: |-
        slow = fast = head
        while fast and fast.next:
            slow = slow.next
            fast = fast.next.next
            if slow is fast:
                return True  # cycle
        return False
      problems:
      - title: Linked List Cycle
        slug: linked-list-cycle
        difficulty: easy
      - title: Middle of the Linked List
        slug: middle-of-the-linked-list
        difficulty: easy
      - title: Happy Number
        slug: happy-number
        difficulty: easy
      - title: Palindrome Linked List
        slug: palindrome-linked-list
        difficulty: easy
      - title: Linked List Cycle II
        slug: linked-list-cycle-ii
        difficulty: medium

  - id: linked-list-reversal
    track: dsa
    title: In-place Reversal
    summary: Reverse all or part of a linked list by re-pointing links, without extra memory.
    difficulty: 3
    phase: 1
    visualizer: linked_list_reversal
    requires:
    - linked-lists
    concepts:
    - Always save curr.next before you overwrite it, or you lose the rest of the list.
    - 'Three pointers are enough: prev, curr and next.'
    - A dummy node before the head makes reversing a middle section much simpler.
    pattern:
      group: Linked lists
      complexity: O(n) time · O(1) space
      walkthrough: Reverse a linked list
      signals:
      - The problem asks to reverse a list, or a part of it
      - You need to process a list in k-sized groups
      - You must compare the first half with the reversed second half
      - Extra memory isn't allowed
      template: |-
        prev, curr = None, head
        while curr:
            nxt = curr.next
            curr.next = prev
            prev, curr = curr, nxt
        return prev
      problems:
      - title: Reverse Linked List
        slug: reverse-linked-list
        difficulty: easy
      - title: Reverse Linked List II
        slug: reverse-linked-list-ii
        difficulty: medium
      - title: Swap Nodes in Pairs
        slug: swap-nodes-in-pairs
        difficulty: medium
      - title: Reorder List
        slug: reorder-list
        difficulty: medium
      - title: Reverse Nodes in k-Group
        slug: reverse-nodes-in-k-group
        difficulty: hard

  - id: monotonic-stack
    track: dsa
    title: Monotonic Stack
    summary: A stack kept in sorted order answers 'next greater' and 'next smaller' questions in O(n).
    difficulty: 4
    phase: 1
    visualizer: monotonic_stack
    requires:
    - stacks-queues
    concepts:
    - Store indices, not values, so you can compute distances and look values up.
    - Each element is pushed once and popped at most once, so the loop is O(n) overall.
    - Use a decreasing stack for 'next greater' and an increasing stack for 'next smaller'.
    pattern:
      group: Stacks and intervals
      complexity: O(n) time · O(n) space
      walkthrough: Days until a warmer temperature
      signals:
      - You need the next (or previous) greater or smaller element for each item
      - The question mentions spans, 'days until', or histograms
      - You need the maximum of every sliding window (a monotonic deque)
      - 'Brute force looks ahead from every element: O(n²)'
      template: |-
        stack = []
        for i, x in enumerate(nums):
            while stack and nums[stack[-1]] < x:
                j = stack.pop()
                answer[j] = x  # x is j's next greater
            stack.append(i)
      problems:
      - title: Next Greater Element I
        slug: next-greater-element-i
        difficulty: easy
      - title: Daily Temperatures
        slug: daily-temperatures
        difficulty: medium
      - title: Online Stock Span
        slug: online-stock-span
        difficulty: medium
      - title: Sliding Window Maximum
        slug: sliding-window-maximum
        difficulty: hard
      - title: Largest Rectangle in Histogram
        slug: largest-rectangle-in-histogram
        difficulty: hard

  - id: merge-intervals
    track: dsa
    title: Merge Intervals
    summary: Sort intervals by start time, then merge, insert or count overlaps in one pass.
    difficulty: 3
    phase: 1
    visualizer: merge_intervals
    requires:
    - arrays
    concepts:
    - After sorting by start, an interval can only overlap the last merged one.
    - Two intervals [a, b] and [c, d] overlap when c <= b (with a <= c after sorting).
    - For 'fewest to remove' style questions, sort by end time and act greedily.
    pattern:
      group: Stacks and intervals
      complexity: O(n log n) time · O(n) space
      walkthrough: Merge overlapping intervals
      signals:
      - The input is a list of ranges, meetings or time slots
      - You need to merge, insert or remove overlapping ranges
      - You need the minimum number of rooms, arrows or removals
      template: |-
        intervals.sort(key=lambda iv: iv[0])
        merged = []
        for start, end in intervals:
            if merged and start <= merged[-1][1]:
                merged[-1][1] = max(merged[-1][1], end)
            else:
                merged.append([start, end])
      problems:
      - title: Merge Intervals
        slug: merge-intervals
        difficulty: medium
      - title: Insert Interval
        slug: insert-interval
        difficulty: medium
      - title: Non-overlapping Intervals
        slug: non-overlapping-intervals
        difficulty: medium
      - title: Interval List Intersections
        slug: interval-list-intersections
        difficulty: medium
      - title: Minimum Number of Arrows to Burst Balloons
        slug: minimum-number-of-arrows-to-burst-balloons
        difficulty: medium

